name: AetherXIV v2.1 Release
run-name: ${{ inputs.build_name || 'AetherXIV v2.1 Release' }}

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Name shown for this release build.
        required: true
        default: AetherXIV v2.1 Release
      build_targets:
        description: Platforms to build; select all to publish a complete release.
        type: choice
        required: true
        default: all
        options:
          - all
          - linux-steamos
          - linux
          - steamos
      release_tag:
        description: Release tag to create or update.
        required: true
        default: release-v2.1
      publish_release:
        description: Publish the AetherXIV 2.1 GitHub Release after all builds pass.
        type: boolean
        required: true
        default: true
  push:
    branches:
      - "2.1"
    tags:
      - "release-v2.1"

permissions:
  contents: write

concurrency:
  group: aetherxiv-2.1-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_CONFIGURATION: Release
  BUILD_NUMBER: 22042
  RELEASE_NAME: AetherXIV v2.1 Release (Build 22042)

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify public release source
        run: ./tools/Development/verify-aetherxiv.sh

  build-linux:
    name: Build Linux x64
    if: ${{ github.event_name == 'push' || inputs.build_targets == 'all' || inputs.build_targets == 'linux-steamos' || inputs.build_targets == 'linux' }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the Wine and Windows cross-build toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bison \
            build-essential \
            flex \
            g++-mingw-w64-i686 \
            gcc-mingw-w64-i686 \
            gcc-mingw-w64-x86-64 \
            libfreetype-dev \
            libgl-dev \
            libgnutls28-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            xz-utils \
            xvfb

      - name: Build the authoritative AetherXIV Linux runtime
        run: |
          runtime_root="${RUNNER_TEMP}/aetherxiv-linux-runtime"
          ./tools/runtime/build-linux.sh "${runtime_root}"
          echo "AETHERXIV_WINE_RUNTIME_ROOT=${runtime_root}" >> "${GITHUB_ENV}"

      - name: Populate the Umbra local NuGet feed
        run: python3 tools/Universal/package-umbra-pluginapi.py

      - name: Build the Linux release
        run: ./tools/Linux/build-aetherxiv.sh "${BUILD_CONFIGURATION}"

      - name: Build the Linux core package
        run: ./tools/Linux/build-aetherxiv.sh "${BUILD_CONFIGURATION}" --scope core

      - name: Verify the bundled Linux runtime and Umbra x86 .NET payload
        run: |
          runtime_root="bin/build/Release/Linux/launcher/app/CompatibilityRuntime"
          wine="${runtime_root}/bin/wine"
          framework="$(pwd)/bin/build/Release/Linux/launcher/app/Umbra/Framework"
          "${wine}" --version
          test -x "${runtime_root}/bin/wineserver"
          test -f "${runtime_root}/lib/wine/x86_64-windows/wow64cpu.dll"
          (cd "${runtime_root}" && sha256sum -c aetherxiv-runtime.sha256)
          python3 tools/Universal/verify-umbra-bundle.py "${framework}"
          test -f "${framework}/Runtime/umbra-runtime.json"
          runtime_version="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "${framework}/Runtime/umbra-runtime.json")"
          test -f "${framework}/Runtime/host/fxr/${runtime_version}/hostfxr.dll"
          test -f "${framework}/Runtime/shared/Microsoft.NETCore.App/${runtime_version}/coreclr.dll"

      - name: Package Linux full, Core, and Launcher downloads
        run: |
          mkdir -p artifacts
          tar -czf artifacts/AetherXIV-2.1.22042-Linux-x64.tar.gz -C bin/build/Release Linux
          tar -czf artifacts/AetherXIV-2.1.22042-Linux-x64-Core.tar.gz -C bin/build/Release Linux-Core
          launcher_stage="${RUNNER_TEMP}/AetherXIV-2.1.22042-Linux-x64-Launcher"
          mkdir -p "${launcher_stage}/desktop/icons"
          cp -a bin/build/Release/Linux/launcher "${launcher_stage}/launcher"
          cp bin/build/Release/Linux/desktop/AetherXIV\ Launcher.desktop "${launcher_stage}/desktop/"
          cp bin/build/Release/Linux/desktop/icons/aetherxiv-launcher.png "${launcher_stage}/desktop/icons/"
          cp LICENSE THIRD_PARTY_NOTICES.md MODIFICATIONS.md TRADEMARKS.md "${launcher_stage}/"
          tar -czf artifacts/AetherXIV-2.1.22042-Linux-x64-Launcher.tar.gz \
            -C "${RUNNER_TEMP}" AetherXIV-2.1.22042-Linux-x64-Launcher

      - name: Upload the Linux release
        uses: actions/upload-artifact@v7
        with:
          name: release-AetherXIV-2.1.22042-Linux-x64
          path: artifacts/*
          if-no-files-found: error

  build-steamos:
    name: Build SteamOS x64
    if: ${{ github.event_name == 'push' || inputs.build_targets == 'all' || inputs.build_targets == 'linux-steamos' || inputs.build_targets == 'steamos' }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the Wine and Windows cross-build toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bison build-essential flex \
            g++-mingw-w64-i686 gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 \
            libfreetype-dev libgl-dev libgnutls28-dev \
            libx11-dev libxext-dev libxfixes-dev libxi-dev libxrandr-dev libxrender-dev

      - name: Build the authoritative AetherXIV SteamOS runtime
        run: |
          runtime_root="${RUNNER_TEMP}/aetherxiv-steamos-runtime"
          ./tools/runtime/build-linux.sh "${runtime_root}"
          echo "AETHERXIV_WINE_RUNTIME_ROOT=${runtime_root}" >> "${GITHUB_ENV}"

      - name: Populate the Umbra local NuGet feed
        run: python3 tools/Universal/package-umbra-pluginapi.py

      - name: Build the SteamOS release
        run: ./tools/SteamOS/build-aetherxiv.sh "${BUILD_CONFIGURATION}"

      - name: Build the SteamOS core package
        run: ./tools/SteamOS/build-aetherxiv.sh "${BUILD_CONFIGURATION}" --scope core

      - name: Package SteamOS full, Core, and Launcher downloads
        run: |
          mkdir -p artifacts
          tar -czf artifacts/AetherXIV-2.1.22042-SteamOS-x64.tar.gz -C bin/build/Release SteamOS
          tar -czf artifacts/AetherXIV-2.1.22042-SteamOS-x64-Core.tar.gz -C bin/build/Release SteamOS-Core
          launcher_stage="${RUNNER_TEMP}/AetherXIV-2.1.22042-SteamOS-x64-Launcher"
          mkdir -p "${launcher_stage}/desktop/icons"
          cp -a bin/build/Release/SteamOS/launcher "${launcher_stage}/launcher"
          cp bin/build/Release/SteamOS/desktop/AetherXIV\ Launcher.desktop "${launcher_stage}/desktop/"
          cp bin/build/Release/SteamOS/desktop/icons/aetherxiv-launcher.png "${launcher_stage}/desktop/icons/"
          cp LICENSE THIRD_PARTY_NOTICES.md MODIFICATIONS.md TRADEMARKS.md "${launcher_stage}/"
          tar -czf artifacts/AetherXIV-2.1.22042-SteamOS-x64-Launcher.tar.gz \
            -C "${RUNNER_TEMP}" AetherXIV-2.1.22042-SteamOS-x64-Launcher

      - name: Upload the SteamOS release
        uses: actions/upload-artifact@v7
        with:
          name: release-AetherXIV-2.1.22042-SteamOS-x64
          path: artifacts/*
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64 with x64 WoW64 runtime
    if: ${{ github.event_name == 'push' || inputs.build_targets == 'all' }}
    needs: verify
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the Wine and Windows cross-build toolchains
        run: |
          # GitHub's macOS image may carry an untrusted, unrelated AWS tap.
          # Remove it quietly before invoking Homebrew so it cannot annotate this build.
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install bison freetype gnutls mingw-w64 molten-vk pkg-config

      - name: Build the authoritative AetherXIV macOS runtime
        run: |
          runtime_root="${RUNNER_TEMP}/aetherxiv-macos-runtime"
          ./tools/runtime/build-macos.sh "${runtime_root}"
          echo "AETHERXIV_WINE_RUNTIME_ROOT=${runtime_root}" >> "${GITHUB_ENV}"

      - name: Populate the Umbra local NuGet feed
        run: python3 tools/Universal/package-umbra-pluginapi.py

      - name: Build the macOS release
        run: ./tools/MacOS/build-aetherxiv.sh "${BUILD_CONFIGURATION}"

      - name: Build the macOS core package
        run: ./tools/MacOS/build-aetherxiv.sh "${BUILD_CONFIGURATION}" --scope core

      - name: Package macOS full, Core, and Launcher downloads
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            bin/build/Release/MacOS \
            artifacts/AetherXIV-2.1.22042-MacOS-arm64.zip
          core_stage="${RUNNER_TEMP}/AetherXIV-2.1.22042-MacOS-arm64-Core"
          mkdir -p "${core_stage}"
          ditto "bin/build/Release/MacOS/AetherXIV Core.app" \
            "${core_stage}/AetherXIV Core.app"
          ditto bin/build/Release/MacOS/Database "${core_stage}/Database"
          cp LICENSE THIRD_PARTY_NOTICES.md MODIFICATIONS.md TRADEMARKS.md "${core_stage}/"
          printf 'schema=aetherxiv.build.manifest.v1\nproduct_version=2.1\nbuild_number=%s\nscope=core\nplatform=MacOS\n' \
            "${BUILD_NUMBER}" > "${core_stage}/build-manifest.txt"
          ditto -c -k --sequesterRsrc --keepParent "${core_stage}" \
            artifacts/AetherXIV-2.1.22042-MacOS-arm64-Core.zip
          launcher_stage="${RUNNER_TEMP}/AetherXIV-2.1.22042-MacOS-arm64-Launcher"
          mkdir -p "${launcher_stage}"
          ditto "bin/build/Release/MacOS/AetherXIV Launcher.app" \
            "${launcher_stage}/AetherXIV Launcher.app"
          cp LICENSE THIRD_PARTY_NOTICES.md MODIFICATIONS.md TRADEMARKS.md "${launcher_stage}/"
          ditto -c -k --sequesterRsrc --keepParent "${launcher_stage}" \
            artifacts/AetherXIV-2.1.22042-MacOS-arm64-Launcher.zip

      - name: Upload the macOS release
        uses: actions/upload-artifact@v7
        with:
          name: release-AetherXIV-2.1.22042-MacOS-arm64
          path: artifacts/*
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    if: ${{ github.event_name == 'push' || inputs.build_targets == 'all' }}
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Populate the Umbra local NuGet feed
        shell: pwsh
        run: python tools/Universal/package-umbra-pluginapi.py

      - name: Build the Windows release
        shell: pwsh
        run: ./tools/Windows/build-aetherxiv.ps1 -Configuration $env:BUILD_CONFIGURATION

      - name: Build the Windows core package
        shell: pwsh
        run: ./tools/Windows/build-aetherxiv.ps1 -Configuration $env:BUILD_CONFIGURATION -Scope core

      - name: Smoke-test the bundled Umbra x86 managed runtime
        shell: pwsh
        run: |
          $frameworkRoot = Resolve-Path "bin/build/Release/Windows/launcher/app/Umbra/Framework"
          $probe = Join-Path $frameworkRoot "Managed/Aether.Umbra.Framework.exe"
          $runtime = Join-Path $frameworkRoot "Runtime"
          $env:DOTNET_ROOT = $runtime
          $env:DOTNET_ROOT_X86 = $runtime
          $output = & $probe --runtime-probe 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/umbra-managed-probe.log"
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled Umbra x86 managed runtime probe exited with $LASTEXITCODE."
          }
          if (($output -join "`n") -notmatch "AETHER_UMBRA_MANAGED_RUNTIME_OK") {
            throw "Bundled Umbra x86 managed runtime did not complete its worker-thread checks."
          }

      - name: Validate Windows client redirect repair
        shell: pwsh
        run: |
          $imageOptionsRoots = @(
            "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows NT\CurrentVersion\Image File Execution Options"
          )
          $clientExecutables = @("ffxivboot.exe", "ffxivlogin.exe", "ffxivgame.exe")
          $testKeys = @()

          try {
            foreach ($root in $imageOptionsRoots) {
              foreach ($clientExecutable in $clientExecutables) {
                $key = Join-Path $root $clientExecutable
                New-Item -Path $key -Force | Out-Null
                New-ItemProperty `
                  -LiteralPath $key `
                  -Name Debugger `
                  -PropertyType String `
                  -Value "D:\Downloads\NovumLauncher\NovumLauncher.exe" `
                  -Force | Out-Null
                $testKeys += $key
              }
            }

            $launcher = Resolve-Path "bin\build\Release\Windows\launcher\app\AetherXIV.Launcher.App.exe"
            $repair = Start-Process `
              -FilePath $launcher `
              -ArgumentList "--remove-novum-ffxiv-launch-redirects" `
              -Wait `
              -PassThru
            if ($repair.ExitCode -ne 0) {
              throw "Packaged Windows redirect repair exited with $($repair.ExitCode)."
            }

            foreach ($key in $testKeys) {
              $debugger = (Get-ItemProperty `
                -LiteralPath $key `
                -Name Debugger `
                -ErrorAction SilentlyContinue).Debugger
              if ($null -ne $debugger) {
                throw "Windows redirect repair left the Debugger value under $key."
              }
            }
          }
          finally {
            foreach ($key in $testKeys) {
              Remove-Item -LiteralPath $key -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Package Windows full, Core, and Launcher downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "bin/build/Release/Windows" -DestinationPath "artifacts/AetherXIV-2.1.22042-Windows-x64.zip" -CompressionLevel Optimal -Force
          Compress-Archive -Path "bin/build/Release/Windows-Core" -DestinationPath "artifacts/AetherXIV-2.1.22042-Windows-x64-Core.zip" -CompressionLevel Optimal -Force
          $launcherStage = Join-Path $env:RUNNER_TEMP "AetherXIV-2.1.22042-Windows-x64-Launcher"
          New-Item -ItemType Directory -Force -Path $launcherStage | Out-Null
          Copy-Item -Recurse -Force "bin/build/Release/Windows/launcher" (Join-Path $launcherStage "launcher")
          Copy-Item -Force LICENSE, THIRD_PARTY_NOTICES.md, MODIFICATIONS.md, TRADEMARKS.md -Destination $launcherStage
          Compress-Archive -Path $launcherStage -DestinationPath "artifacts/AetherXIV-2.1.22042-Windows-x64-Launcher.zip" -CompressionLevel Optimal -Force

      - name: Upload the Windows release
        uses: actions/upload-artifact@v7
        with:
          name: release-AetherXIV-2.1.22042-Windows-x64
          path: artifacts/*
          if-no-files-found: error

  build-docker:
    name: Validate Docker server (amd64 + arm64)
    if: ${{ github.event_name == 'push' || inputs.build_targets == 'all' }}
    needs: verify
    runs-on: ubuntu-latest
    env:
      AETHERXIV_DB_ROOT_PASSWORD: ci-root-password
      AETHERXIV_DB_PASSWORD: ci-server-password
      AETHERXIV_PUBLIC_HOST: 127.0.0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate the Compose model
        run: docker compose config --quiet

      - name: Build both server architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=aetherxiv-server
          cache-to: type=gha,mode=max,scope=aetherxiv-server

      - name: Start the complete Compose stack
        run: docker compose up --build --detach --wait --wait-timeout 240

      - name: Verify MariaDB and Launcher Services
        run: |
          docker compose ps
          docker compose exec -T mariadb mariadb \
            --user=root \
            --password="${AETHERXIV_DB_ROOT_PASSWORD}" \
            --execute="USE ffxiv_server; SELECT COUNT(*) AS server_count FROM servers;"
          curl --fail --show-error --silent \
            --retry 12 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8080/launcher/status

      - name: Capture Docker logs after a failure
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Stop the Compose stack
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans

  publish-release:
    name: Publish AetherXIV 2.1
    if: ${{ always() && !cancelled() && needs.verify.result == 'success' && needs.build-linux.result == 'success' && needs.build-steamos.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-docker.result == 'success' && (github.event_name == 'push' || inputs.build_targets == 'all') && (github.event_name == 'push' || inputs.publish_release) }}
    needs:
      - verify
      - build-linux
      - build-steamos
      - build-macos
      - build-windows
      - build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-AetherXIV-2.1.22042-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum ./* > SHA256SUMS.txt

      - name: Replace the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          release_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF}" != refs/tags/* ]]; then
            release_tag="${INPUT_RELEASE_TAG:-release-v2.1}"
            git tag --force "${release_tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${release_tag}" --force
          fi

          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release delete "${release_tag}" --yes
          fi

          gh release create "${release_tag}" "${assets[@]}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_NAME}" \
            --notes-file docs/AETHERXIV_2.1_RELEASE_NOTES.md
